name: Automated Android APK Build & GitHub OTA Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish OTA Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Capacitor Android Web Assets
        run: npx cap sync android

      - name: Generate Automatic Version & Tag
        id: vars
        run: |
          TIMESTAMP=$(date +%s)
          VERSION_CODE=${TIMESTAMP}
          VERSION_NAME="1.0.${VERSION_CODE}"
          TAG_NAME="v${VERSION_NAME}"
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Build Android APK Package
        id: build_apk
        env:
          VERSION_CODE: ${{ steps.vars.outputs.version_code }}
          VERSION_NAME: ${{ steps.vars.outputs.version_name }}
        run: |
          set -e
          mkdir -p build/outputs

          if [ ! -d "android" ] || [ ! -f "android/gradlew" ]; then
            echo "::error::Android directory or gradlew missing!"
            exit 1
          fi

          echo "Building Android release APK via Gradle..."
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=${{ steps.vars.outputs.version_code }} -PversionName=${{ steps.vars.outputs.version_name }} --no-daemon
          cd ..

          RAW_APK=$(find android/app/build/outputs/apk/ -name "*.apk" 2>/dev/null | head -n 1)

          if [ -z "$RAW_APK" ] || [ ! -f "$RAW_APK" ]; then
            echo "::error::APK build failed: No APK file was generated by Gradle."
            exit 1
          fi

          FINAL_APK="$(pwd)/build/outputs/business_market_v${{ steps.vars.outputs.version_name }}.apk"
          cp "$RAW_APK" "$FINAL_APK"

          if [ ! -f "$FINAL_APK" ]; then
            echo "::error::Final APK file copy failed at ${FINAL_APK}"
            exit 1
          fi

          ABS_PATH=$(readlink -f "$FINAL_APK")
          APK_SIZE=$(stat -c%s "$FINAL_APK" 2>/dev/null || stat -f%z "$FINAL_APK" 2>/dev/null)

          echo "=========================================="
          echo "APK BUILD VERIFICATION SUCCESSFUL"
          echo "Absolute Path: ${ABS_PATH}"
          echo "File Size: ${APK_SIZE} bytes"
          echo "=========================================="

          if [ "$APK_SIZE" -lt 500000 ]; then
            echo "::error::Generated APK size (${APK_SIZE} bytes) is invalid or too small."
            exit 1
          fi

          echo "apk_path=${FINAL_APK}" >> $GITHUB_OUTPUT
          echo "apk_abs_path=${ABS_PATH}" >> $GITHUB_OUTPUT
          echo "apk_size=${APK_SIZE}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release & Upload APK Asset
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          repository: zaki-le-roi/business-market-releases
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: "Automatic OTA Release ${{ steps.vars.outputs.tag_name }}"
          body: |
            ## 🚀 Automatic OTA Update
            - **Version Name:** ${{ steps.vars.outputs.version_name }}
            - **Version Code:** ${{ steps.vars.outputs.version_code }}
            - **Release Date:** ${{ github.event.head_commit.timestamp || 'Automated Pipeline' }}
            - **Commit SHA:** ${{ github.sha }}

            This release was automatically compiled and uploaded by the CI/CD OTA update pipeline.
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ${{ steps.build_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Verify Release Asset & Test Download URL
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.vars.outputs.tag_name }}
        run: |
          set -e
          echo "Verifying release assets for tag ${TAG_NAME}..."

          RELEASE_INFO=$(curl -sH "Authorization: token ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/zaki-le-roi/business-market-releases/releases/tags/${TAG_NAME}")

          ASSET_URL=$(echo "$RELEASE_INFO" | grep -o '"browser_download_url": "[^"]*"' | head -n 1 | cut -d'"' -f4)

          if [ -z "$ASSET_URL" ]; then
            echo "::error::Release ${TAG_NAME} contains NO asset! Rolling back empty release..."
            RELEASE_ID=$(echo "$RELEASE_INFO" | grep -o '"id": [0-9]*' | head -n 1 | awk '{print $2}')
            if [ -n "$RELEASE_ID" ]; then
              curl -X DELETE -sH "Authorization: token ${GITHUB_TOKEN}" \
                "https://api.github.com/repos/zaki-le-roi/business-market-releases/releases/${RELEASE_ID}"
            fi
            exit 1
          fi

          echo "Asset verified in release! Download URL: ${ASSET_URL}"
          echo "Testing HTTP reachability of download URL..."

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -L "$ASSET_URL")
          echo "Download URL HTTP Response Code: ${HTTP_CODE}"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Download URL failed reachability test with HTTP status ${HTTP_CODE}"
            exit 1
          fi

          echo "=========================================="
          echo "SUCCESS: APK Release published & verified!"
          echo "Tag: ${TAG_NAME}"
          echo "Download URL: ${ASSET_URL}"
          echo "=========================================="

